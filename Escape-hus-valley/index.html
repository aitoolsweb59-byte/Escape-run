<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ESCAPE HUS VALLEY</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container"></div>

    <!-- MAIN MENU -->
    <div id="ui-main" class="ui-layer">
        <div class="glass-panel">
            <h1>ESCAPE HUS VALLEY</h1>
            <p class="tagline">Survival is a matter of pace.</p>
            <input type="text" id="player-name" placeholder="Enter Nickname" maxlength="12">
            <button id="btn-create" class="primary-btn">Create Room</button>
            <div class="join-group">
                <input type="number" id="room-code-input" placeholder="4-Digit Code" maxlength="4">
                <button id="btn-join" class="secondary-btn">Join Room</button>
            </div>
            <p id="connection-status" class="status-text">Connecting to server...</p>
        </div>
    </div>

    <!-- LOBBY -->
    <div id="ui-lobby" class="ui-layer hidden">
        <div class="glass-panel">
            <h2>ROOM CODE: <span id="lobby-code" class="highlight">----</span></h2>
            <div class="roster-container">
                <h3>Players</h3>
                <ul id="roster-list"></ul>
            </div>
            <button id="btn-start" class="primary-btn hidden">Start Match (Host)</button>
        </div>
    </div>

    <!-- GAME HUD -->
    <div id="ui-hud" class="ui-layer hidden">
        <div class="hud-top">
            <div id="time-display">01:00</div>
            <div id="role-display">Role</div>
        </div>
        <div class="stamina-container">
            <div id="stamina-bar"></div>
        </div>
        <!-- Mobile Controls (Hidden on desktop via CSS, injected via JS) -->
        <div id="mobile-controls" class="mobile-only">
            <button id="btn-left" class="ctrl-btn">←</button>
            <div class="center-ctrls">
                <button id="btn-jump" class="ctrl-btn action-btn">JUMP</button>
                <button id="btn-slide" class="ctrl-btn action-btn">SLIDE</button>
            </div>
            <button id="btn-right" class="ctrl-btn">→</button>
        </div>
    </div>

    <!-- RESULTS -->
    <div id="ui-results" class="ui-layer hidden">
        <div class="glass-panel">
            <h1 id="result-title">MATCH OVER</h1>
            <p id="result-subtitle">Returning to lobby...</p>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
